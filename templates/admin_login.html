<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão STP</title>
  <style>
    body { font-family: Inter, system-ui, sans-serif; background: #0f172a; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { background: #1e293b; padding: 32px; border-radius: 12px; width: 100%; max-width: 360px; }
    h1 { margin: 0 0 20px; font-size: 1.4rem; }
    label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: #94a3b8; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #fff; margin-bottom: 16px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #e11d48; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button:hover { background: #be123c; }
    .flash { padding: 10px; border-radius: 8px; margin-bottom: 16px; }
    .flash.ok { background: #065f46; }
    .flash.erro { background: #7f1d1d; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Gestão STP</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <label>Usuário</label>
      <input type="text" name="usuario" required autofocus>
      <label>Senha</label>
      <input type="password" name="senha" required>
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
